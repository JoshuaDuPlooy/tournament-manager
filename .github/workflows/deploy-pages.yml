name: Deploy public sites to GitHub Pages

# Both tournaments are published from this one repo, each under its own path:
#   /tournament-manager/                  landing/          (tournament index)
#   /tournament-manager/ravens-junior/    Ravens 2026 Junior Championships/site/
#   /tournament-manager/savets-2026/      Savets 2026/site/
#
# The path comes from each tournament's tournament.config.json ("publicPath"), so
# there is one source of truth. Adding a tournament means adding its folder to the
# TOURNAMENTS list below.

on:
  push:
    branches: ["main"]
    paths:
      - "Ravens 2026 Junior Championships/site/**"
      - "Ravens 2026 Junior Championships/tournament.config.json"
      - "Savets 2026/site/**"
      - "Savets 2026/tournament.config.json"
      - "landing/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble the sites
        env:
          TOURNAMENTS: |
            Ravens 2026 Junior Championships
            Savets 2026
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -r landing/. _site/
          echo "$TOURNAMENTS" | while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            path=$(jq -er .publicPath "$dir/tournament.config.json")
            mkdir -p "_site/$path"
            cp -r "$dir/site/." "_site/$path/"
            echo "published '$dir' at /$path/"
          done
          echo "--- _site ---"
          find _site -maxdepth 2 -type d

      - name: Upload _site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
