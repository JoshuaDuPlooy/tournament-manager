<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tournament</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="top-nav">
    <div class="nav-links" id="navLinks">
      <a href="index.html" class="active">Overview</a>
      <a href="entries.html" id="nav-entries">Entries</a>
      <a href="groups.html">Groups</a>
      <a href="knockouts.html">Knockouts</a>
      <a href="schedule.html">Schedule</a>
    </div>
    <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="page-header">
    <img src="logo.png" alt="Ravens Logo" />
    <div class="page-header-text">
      <h1 id="tournament-name">Loading…</h1>
      <p id="tournament-subtitle"></p>
    </div>
  </div>

  <main>
    <h2>Details</h2>
    <table>
      <tbody id="details-body"></tbody>
    </table>

    <h2>Events</h2>
    <table>
      <thead><tr><th>Event</th><th>Entries</th></tr></thead>
      <tbody id="events-body"></tbody>
    </table>
  </main>

  <script src="js/data.js"></script>
  <script>
    function toggleMenu() {
      document.getElementById("navLinks").classList.toggle("open");
      document.getElementById("hamburger").classList.toggle("open");
    }

    loadEntriesData().then(({ tournament, entries }) => {
      document.getElementById("tournament-name").textContent = tournament.name;
      document.getElementById("tournament-subtitle").textContent =
        `${tournament.startDate} — ${tournament.endDate} · ${tournament.venue}`;

      const detailsBody = document.getElementById("details-body");
      detailsBody.innerHTML = `
        <tr><td>Season</td><td>${tournament.season}</td></tr>
        <tr><td>Venue</td><td>${tournament.venue}</td></tr>
        <tr><td>Dates</td><td>${tournament.startDate} to ${tournament.endDate}</td></tr>
      `;

      const eventsBody = document.getElementById("events-body");
      eventsBody.innerHTML = tournament.events
        .map((ev) => {
          const count =
            tournament.entriesVisible === false
              ? "—"
              : entries.filter((e) => (e.events || []).includes(ev)).length;
          return `<tr><td>${ev}</td><td>${count}</td></tr>`;
        })
        .join("");
    });
  </script>
</body>
</html>
