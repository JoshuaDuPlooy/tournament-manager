<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ravens Tournaments</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --color-bg: #f4f4f4;
      --color-surface: #ffffff;
      --color-border: #e0e0e0;
      --color-text: #222222;
      --color-muted: #666666;
      --color-accent: #2EB4EA;
      --color-nav-bg: #111111;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
    }
    .page-header {
      background: var(--color-nav-bg);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 24px 16px;
    }
    .page-header img { height: 56px; width: auto; }
    .page-header h1 { font-size: 22px; letter-spacing: 0.5px; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
    main > h2 { font-size: 16px; color: var(--color-muted); font-weight: bold; margin-bottom: 12px; }
    ul { list-style: none; display: grid; gap: 12px; }
    a.tournament {
      display: block;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-accent);
      border-radius: 4px;
      padding: 18px 20px;
      text-decoration: none;
      color: var(--color-text);
      transition: border-color 0.2s, transform 0.2s;
    }
    a.tournament:hover { border-color: var(--color-accent); transform: translateY(-1px); }
    a.tournament .name { font-size: 18px; font-weight: bold; display: block; }
    a.tournament .meta { font-size: 14px; color: var(--color-muted); display: block; margin-top: 4px; }
    li.upcoming {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-border);
      border-radius: 4px;
      padding: 18px 20px;
      color: var(--color-muted);
    }
    li.upcoming .name { font-size: 18px; font-weight: bold; display: block; color: var(--color-muted); }
    li.upcoming .meta { font-size: 14px; display: block; margin-top: 4px; }
    @media (max-width: 600px) {
      .page-header { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <img src="logo.png" alt="Ravens Logo" />
    <h1>Ravens Tournaments</h1>
  </div>

  <main>
    <h2>Tournaments</h2>
    <ul>
      <li>
        <a class="tournament" href="ravens-junior/">
          <span class="name">Ravens 2026 Junior Championships</span>
          <span class="meta">Entries, groups, knockouts and schedule &rarr;</span>
        </a>
      </li>
      <li>
        <a class="tournament" href="savets-2026/">
          <span class="name">Savetts 2026</span>
          <span class="meta">Entries, groups, knockouts and schedule &rarr;</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
